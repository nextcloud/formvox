# Forgejo Actions: FormVox CI — lint + static analysis + unit tests.
#
# Runs the STANDALONE suites (no running Nextcloud needed): the PHP unit tests
# resolve OCP via the nextcloud/ocp stubs, and the JS unit tests stub the
# @nextcloud/* packages. Both are fast and run on every push and PR.
#
# NOT here: integration tests against a real Nextcloud + database (the NC-app
# pattern with a DB matrix). That needs the server checked out around the app
# and is a separate, heavier workflow to add later.

name: CI

on:
  # Run on every branch push so feature branches are gated too, plus PRs to the
  # main lines and manual dispatch.
  push:
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  php:
    name: PHP — lint, coding-standard, Psalm, unit
    runs-on: ubuntu-latest
    # NOT a job-level `container:` — the Forgejo runner runs JS-based actions
    # (actions/checkout) with Node, which the php:8.2-cli image lacks ("node not
    # found in $PATH"). Instead checkout on the host, then run all PHP steps in
    # one `docker run php:8.2-cli` over the mounted workspace. Also avoids
    # shivammathur/setup-php, which data.forgejo.org does not mirror.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PHP checks in a php:8.2 container
        run: |
          docker run --rm -v "$PWD":/app -w /app php:8.2-cli bash -c '
            set -e
            apt-get update -qq
            apt-get install -y --no-install-recommends git unzip libzip-dev >/dev/null
            docker-php-ext-install zip >/dev/null
            curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
            composer validate --no-check-publish
            composer install --prefer-dist --no-progress --no-interaction
            composer lint
            composer cs:check
            composer psalm
            composer test:unit
          '

  js:
    name: JS — unit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (Vitest)
        run: npm run test:js

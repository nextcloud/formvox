# Forgejo Actions: FormVox CI — lint + static analysis + unit tests.
#
# Runs the STANDALONE suites (no running Nextcloud needed): the PHP unit tests
# resolve OCP via the nextcloud/ocp stubs, and the JS unit tests stub the
# @nextcloud/* packages. Both are fast and run on every push and PR.
#
# NOT here: integration tests against a real Nextcloud + database (the NC-app
# pattern with a DB matrix). That needs the server checked out around the app
# and is a separate, heavier workflow to add later.

name: CI

on:
  # Run on every branch push so feature branches are gated too, plus PRs to the
  # main lines and manual dispatch.
  push:
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  php:
    name: PHP — lint, coding-standard, Psalm, unit
    runs-on: ubuntu-latest
    # Run inside an official PHP image rather than using shivammathur/setup-php:
    # the Forgejo runner resolves actions from data.forgejo.org, which does not
    # mirror that action. The container already has the PHP version we target.
    container:
      image: php:8.2-cli
    steps:
      - name: Install OS + PHP build deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git unzip libzip-dev
          docker-php-ext-install zip
          # Composer
          curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer

      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: PHP syntax lint
        run: composer lint

      - name: Coding standard (php-cs-fixer)
        run: composer cs:check

      - name: Static analysis (Psalm)
        run: composer psalm

      - name: Unit tests
        run: composer test:unit

  js:
    name: JS — unit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (Vitest)
        run: npm run test:js

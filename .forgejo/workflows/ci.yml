# Forgejo Actions: FormVox CI — lint + static analysis + unit tests.
#
# Runs the STANDALONE suites (no running Nextcloud needed): the PHP unit tests
# resolve OCP via the nextcloud/ocp stubs, and the JS unit tests stub the
# @nextcloud/* packages. Both are fast and run on every push and PR.
#
# NOT here: integration tests against a real Nextcloud + database (the NC-app
# pattern with a DB matrix). That needs the server checked out around the app
# and is a separate, heavier workflow to add later.

name: CI

on:
  # Run on every branch push so feature branches are gated too, plus PRs to the
  # main lines and manual dispatch.
  push:
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  php:
    name: PHP — lint, coding-standard, Psalm, unit
    runs-on: ubuntu-latest
    # The runner image (catthehacker/ubuntu:act-22.04) has Node for the actions
    # but no PHP, and data.forgejo.org does not mirror shivammathur/setup-php, so
    # install PHP + composer directly on the host via ondrej/php. Avoids both the
    # missing action and the docker-in-docker workspace-mount pitfalls.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PHP 8.2 + Composer
        run: |
          set -e
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y --no-install-recommends software-properties-common ca-certificates curl unzip git >/dev/null
          add-apt-repository -y ppa:ondrej/php >/dev/null
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            php8.2-cli php8.2-xml php8.2-mbstring php8.2-zip php8.2-curl >/dev/null
          curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
          php -v

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: PHP syntax lint
        run: composer lint

      - name: Coding standard (php-cs-fixer)
        run: composer cs:check

      - name: Static analysis (Psalm)
        run: |
          # Psalm can't run on the PHP 8.5 dev host, so the baseline of
          # pre-existing lower-severity findings is generated here on first run
          # if absent. New issues (not in the baseline) still fail the build.
          if [ ! -f tests/psalm-baseline.xml ]; then
            echo "No Psalm baseline yet — generating one for pre-existing findings."
            ./vendor/bin/psalm --no-cache --set-baseline=tests/psalm-baseline.xml || true
          fi
          composer psalm

      - name: Unit tests
        run: composer test:unit

  js:
    name: JS — unit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (Vitest)
        run: npm run test:js

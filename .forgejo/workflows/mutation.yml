# Forgejo Actions: FormVox mutation testing (Stryker) — main only.
#
# Mutation testing measures whether the JS unit tests actually ASSERT behaviour
# (it mutates src/ and checks the suite catches each change), not just cover it.
# A full src/ run is heavy (~1-2h), so it runs ONLY on push to main and manual
# dispatch — never on feature branches (those get the fast ci.yml gate).
#
# The mutation score is reported; the run fails below the `break` threshold in
# stryker.config.mjs.

name: Mutation

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  stryker:
    name: Stryker — JS mutation testing
    runs-on: ubuntu-latest
    # Generous ceiling: a full-tree mutation run is long.
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Stryker 10 requires Node >=22 (the unit-test job on Node 20 is fine,
          # but Stryker's CLI hard-fails below 22).
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run Stryker (full src/)
        run: npm run test:mutation
        # No upload-artifact step: Forgejo (like GHES) does not support
        # upload-artifact@v4's API, and with if:always() it reddened the job even
        # when Stryker itself passed. The mutation score in the job log is the
        # gate; the HTML report (reports/mutation) is produced in the workspace
        # for local runs. Add artifact upload back if/when the runner supports it.

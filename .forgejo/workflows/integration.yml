# Forgejo Actions: FormVox INTEGRATION tests against a real Nextcloud + DB.
#
# NC 30-34 across SQLite, MySQL/MariaDB and Postgres, exercising the paths unit
# tests can't (real DB lock, real filecache resolution, real .fvform round-trips,
# real DataDownloadResponse). Heavy, so PR + manual dispatch only — the fast
# unit/lint/psalm gate lives in ci.yml on every push.
#
# Three separate jobs (one per DB) so a job only ever starts the ONE service it
# needs — an earlier single-job-with-both-services version collided on the fixed
# host ports (0.0.0.0:4444 "already allocated") when matrix jobs shared the
# runner. Each DB job runs its NC-version matrix with max-parallel 1 so the same
# host port is never bound by two concurrent jobs.
#
# Forgejo runner constraints (as in ci.yml): actions resolve from
# data.forgejo.org (use actions/checkout, present there) and PHP is installed on
# the host via ondrej/php (shivammathur/setup-php is absent there). Steps run on
# the host, so DB services are reached via their mapped host port on 127.0.0.1.

name: Integration

on:
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  sqlite:
    name: NC ${{ matrix.server }} / sqlite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server: [stable30, stable31, stable32, stable33, stable34]
    steps:
      - name: Install PHP 8.2 + Composer
        run: |
          set -e
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y --no-install-recommends software-properties-common ca-certificates curl unzip git >/dev/null
          add-apt-repository -y ppa:ondrej/php >/dev/null
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            php8.2-cli php8.2-xml php8.2-mbstring php8.2-zip php8.2-curl \
            php8.2-gd php8.2-intl php8.2-bcmath php8.2-gmp php8.2-sqlite3 >/dev/null
          curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
      - name: Clone Nextcloud server ${{ matrix.server }} from GitHub
        # NOT actions/checkout: on this Forgejo runner it clones from the local
        # instance (http://forgejo:3000/nextcloud/server → "not found"). Clone
        # GitHub explicitly, shallow, with submodules (3rdparty is required).
        run: |
          git clone --depth=1 --branch "${{ matrix.server }}" --recurse-submodules --shallow-submodules \
            https://github.com/nextcloud/server.git server
      - name: Checkout FormVox into apps/
        uses: actions/checkout@v4
        with: { path: server/apps/formvox }
      - name: Install FormVox dev dependencies
        working-directory: server/apps/formvox
        run: composer install --prefer-dist --no-progress --no-interaction
      - name: Install Nextcloud (sqlite)
        working-directory: server
        run: php occ maintenance:install --verbose --database=sqlite --admin-user admin --admin-pass admin
      - name: Enable FormVox
        working-directory: server
        run: php occ app:enable --force formvox
      - name: Integration tests
        working-directory: server/apps/formvox
        run: composer test:integration

  mysql:
    name: NC ${{ matrix.server }} / mysql
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server: [stable30, stable31, stable32, stable33, stable34]
    steps:
      - name: Install PHP 8.2 + Composer + MariaDB on the host
        # DB on the host (not a services: container): the single Forgejo runner
        # collided on the fixed host port when service containers from parallel
        # matrix jobs bound the same port. A host DB reached via 127.0.0.1:3306
        # avoids the whole container/port/networking class of problems.
        run: |
          set -e
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y --no-install-recommends software-properties-common ca-certificates curl unzip git mariadb-server >/dev/null
          add-apt-repository -y ppa:ondrej/php >/dev/null
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            php8.2-cli php8.2-xml php8.2-mbstring php8.2-zip php8.2-curl \
            php8.2-gd php8.2-intl php8.2-bcmath php8.2-gmp php8.2-mysql >/dev/null
          curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
          # Start MariaDB and create the nextcloud db + user.
          mkdir -p /var/run/mysqld && chown mysql:mysql /var/run/mysqld
          mysqld_safe --skip-grant-tables=0 &
          for i in $(seq 1 30); do mysqladmin ping --silent 2>/dev/null && break; sleep 1; done
          mysql -e "CREATE DATABASE IF NOT EXISTS nextcloud CHARACTER SET utf8mb4;"
          mysql -e "CREATE USER IF NOT EXISTS 'nc'@'127.0.0.1' IDENTIFIED BY 'ncpass';"
          mysql -e "GRANT ALL ON nextcloud.* TO 'nc'@'127.0.0.1'; FLUSH PRIVILEGES;"
      - name: Clone Nextcloud server ${{ matrix.server }} from GitHub
        run: |
          git clone --depth=1 --branch "${{ matrix.server }}" --recurse-submodules --shallow-submodules \
            https://github.com/nextcloud/server.git server
      - name: Checkout FormVox into apps/
        uses: actions/checkout@v4
        with: { path: server/apps/formvox }
      - name: Install FormVox dev dependencies
        working-directory: server/apps/formvox
        run: composer install --prefer-dist --no-progress --no-interaction
      - name: Install Nextcloud (mysql)
        working-directory: server
        run: |
          php occ maintenance:install --verbose --database=mysql \
            --database-name=nextcloud --database-host=127.0.0.1 --database-port=3306 \
            --database-user=nc --database-pass=ncpass \
            --admin-user admin --admin-pass admin
      - name: Enable FormVox
        working-directory: server
        run: php occ app:enable --force formvox
      - name: Integration tests
        working-directory: server/apps/formvox
        run: composer test:integration

  pgsql:
    name: NC ${{ matrix.server }} / pgsql
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server: [stable30, stable31, stable32, stable33, stable34]
    steps:
      - name: Install PHP 8.2 + Composer + Postgres on the host
        # DB on the host (not a services: container) — see the mysql job: avoids
        # the fixed-host-port collision between parallel matrix jobs on the
        # single Forgejo runner. Reached via 127.0.0.1:5432.
        run: |
          set -e
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y --no-install-recommends software-properties-common ca-certificates curl unzip git postgresql postgresql-contrib >/dev/null
          add-apt-repository -y ppa:ondrej/php >/dev/null
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            php8.2-cli php8.2-xml php8.2-mbstring php8.2-zip php8.2-curl \
            php8.2-gd php8.2-intl php8.2-bcmath php8.2-gmp php8.2-pgsql >/dev/null
          curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
          # Start Postgres and create the nextcloud db + user (listen on localhost).
          service postgresql start || pg_ctlcluster "$(ls /etc/postgresql)" main start
          for i in $(seq 1 30); do pg_isready -h 127.0.0.1 -p 5432 && break; sleep 1; done
          sudo -u postgres psql -c "CREATE USER nc WITH PASSWORD 'ncpass';" || true
          sudo -u postgres psql -c "CREATE DATABASE nextcloud OWNER nc;" || true
      - name: Clone Nextcloud server ${{ matrix.server }} from GitHub
        run: |
          git clone --depth=1 --branch "${{ matrix.server }}" --recurse-submodules --shallow-submodules \
            https://github.com/nextcloud/server.git server
      - name: Checkout FormVox into apps/
        uses: actions/checkout@v4
        with: { path: server/apps/formvox }
      - name: Install FormVox dev dependencies
        working-directory: server/apps/formvox
        run: composer install --prefer-dist --no-progress --no-interaction
      - name: Install Nextcloud (pgsql)
        working-directory: server
        run: |
          php occ maintenance:install --verbose --database=pgsql \
            --database-name=nextcloud --database-host=127.0.0.1 --database-port=5432 \
            --database-user=nc --database-pass=ncpass \
            --admin-user admin --admin-pass admin
      - name: Enable FormVox
        working-directory: server
        run: php occ app:enable --force formvox
      - name: Integration tests
        working-directory: server/apps/formvox
        run: composer test:integration
